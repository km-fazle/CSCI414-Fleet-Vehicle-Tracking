net:
  bindIp: 10.30.30.10
  port: 27017
  unixDomainSocket:
    enabled: false

storage:
  dbPath: /var/lib/fleettrace/mongo
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.25

systemLog:
  destination: file
  path: /var/lib/fleettrace/mongod.log
  logAppend: true

processManagement:
  fork: true
  pidFilePath: /var/lib/fleettrace/mongod.pid
